name: CI

on:
  push:
  pull_request:

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Run schema and data
        run: |
          mysql -h 127.0.0.1 -uroot -proot < 01_criar_tabelas.sql
          mysql -h 127.0.0.1 -uroot -proot < 02_inserir_dados.sql
      - name: Run queries
        run: mysql -h 127.0.0.1 -uroot -proot < 03_consultas.sql
